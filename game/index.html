<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Golden Skillet — a cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; touch-action: none; background: #f3e2c2; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="The Golden Skillet: run a kitchen, cook orders and serve them before the customers walk out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
